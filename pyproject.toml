[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kazna"
version = "0.1.0"
description = "Minimal Nostr identity CLI, groundwork for a NIP-46 signer"
requires-python = ">=3.11"
dependencies = [
    "coincurve>=20",
    "bech32>=1.2",
    "cryptography>=42",
    "websockets>=13",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
kazna = "kazna.cli:main"

[tool.setuptools]
packages = ["kazna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
